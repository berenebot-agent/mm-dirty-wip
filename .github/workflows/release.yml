name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mammothmail

jobs:
  gate:
    name: Release test gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite development library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal tests dialmx)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Build
        run: go build -buildvcs=false ./cmd/... ./dialmx/cmd/...
      - name: Test
        run: go test -mod=readonly -race -count=1 -timeout=60s ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: plugins/openclaw/openclaw-plugin/package-lock.json
      - name: OpenClaw build and tests
        working-directory: plugins/openclaw/openclaw-plugin
        run: |
          npm ci
          npm run build
          npm test

  image:
    name: Publish multi-architecture images
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set release metadata
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Refusing non-alpha/beta/rc or malformed release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" =~ -alpha\. ]]; then
            echo "channel=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute core image tags
        id: core_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.channel }}
            type=raw,value=latest

      - name: Build and push core image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.core_meta.outputs.tags }}
          labels: ${{ steps.core_meta.outputs.labels }}

      - name: Compute MX image tags
        id: mx_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}-remote-mx
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.channel }}
            type=raw,value=latest

      - name: Build and push MX image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dialmx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.mx_meta.outputs.tags }}
          labels: ${{ steps.mx_meta.outputs.labels }}

      # Idempotent: skip creation if the GitHub Release already exists.
      # A genuine release-creation failure must fail the workflow.
      - name: Create GitHub release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Mammoth Mail $GITHUB_REF_NAME" \
              --generate-notes
          fi
